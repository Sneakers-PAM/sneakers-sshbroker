syntax = "proto3";

package sneakers.common.v1;

option go_package = "github.com/Sneakers-PAM/sneakers-sshbroker/gen/go/sneakers/common/v1;commonv1";

// Minimal service liveness surface for scaffold verification.
service HealthService {
  rpc Check(CheckRequest) returns (CheckResponse);
}

message CheckRequest {}

message CheckResponse {
  string status = 1; // "SERVING"
}
